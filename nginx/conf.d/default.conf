# ============================================================
# Upstream: Gunicorn running in the web container
# ============================================================
upstream django {
    server web:8000;
    keepalive 32;
}

# ============================================================
# HTTP server
# In production (Phase 10) this redirects to HTTPS.
# In this phase it serves the app directly.
# ============================================================
server {
    listen 80;
    server_name _;

    # Security headers — set at Nginx level
    # These apply to every response including static files
    add_header X-Frame-Options          "DENY"                  always;
    add_header X-Content-Type-Options   "nosniff"               always;
    add_header X-XSS-Protection         "1; mode=block"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Max upload size — matches our file validator limits
    client_max_body_size 10M;

    # Timeouts
    client_body_timeout   12s;
    client_header_timeout 12s;
    send_timeout          10s;

    # Gzip compression
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Static files ─────────────────────────────────────────
    # Served directly by Nginx — never touches Python
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ── Media files ──────────────────────────────────────────
    # User-uploaded files served directly
    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";

        # Deny execution of scripts in media directory
        location ~* \.(php|py|pl|sh|cgi)$ {
            deny all;
        }
    }

    # ── Health check ─────────────────────────────────────────
    # Bypass Nginx logging for health checks — reduces log noise
    location /health/ {
        proxy_pass         http://django;
        proxy_set_header   Host $host;
        access_log         off;
    }

    # ── Django application ───────────────────────────────────
    location / {
        proxy_pass         http://django;

        # Pass real client info to Django
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # Buffer settings — protect Gunicorn from slow clients
        proxy_buffering           on;
        proxy_buffer_size         4k;
        proxy_buffers             8 4k;
        proxy_busy_buffers_size   8k;

        # Connection reuse
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
    }

    # ── Block common attack patterns ─────────────────────────
    location ~* \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
        return 404;
    }

    # Block access to hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}