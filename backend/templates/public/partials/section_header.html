<div class="text-center mb-12 aos">
    {% if label %}
    <p class="text-primary-400 text-sm font-semibold uppercase tracking-widest mb-3 mono">{{ label }}</p>
    {% endif %}
    <h2 class="text-3xl md:text-4xl font-bold text-white mb-4">{{ title }}</h2>
    {% if subtitle %}
    <p class="text-slate-400 max-w-2xl mx-auto">{{ subtitle }}</p>
    {% endif %}
</div>
