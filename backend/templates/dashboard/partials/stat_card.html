<div class="bg-gray-900 rounded-xl border border-gray-800 p-6">
    <div class="flex items-center justify-between">
        <div>
            <p class="text-sm text-gray-400">{{ label }}</p>
            <p class="text-3xl font-bold text-white mt-1">{{ value }}</p>
        </div>
        <div class="w-12 h-12 rounded-xl flex items-center justify-center
            {% if color == 'blue' %}bg-blue-900 text-blue-400
            {% elif color == 'yellow' %}bg-yellow-900 text-yellow-400
            {% elif color == 'green' %}bg-green-900 text-green-400
            {% elif color == 'red' %}bg-red-900 text-red-400
            {% elif color == 'purple' %}bg-purple-900 text-purple-400
            {% else %}bg-gray-800 text-gray-400{% endif %}">
            <i class="fa-solid {{ icon }} text-xl"></i>
        </div>
    </div>
</div>
