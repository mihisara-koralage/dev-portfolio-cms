{% extends 'dashboard/auth/base_auth.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="text-center mb-8">
    <div class="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
        <i class="fa-solid fa-code text-white text-2xl"></i>
    </div>
    <h1 class="text-2xl font-bold text-white">Portfolio CMS</h1>
    <p class="text-gray-400 mt-1">Sign in to manage your portfolio</p>
</div>

<div class="bg-gray-900 rounded-2xl border border-gray-800 p-8">
    <form method="post" class="space-y-5">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-300 mb-1.5">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p class="mt-1 text-sm text-red-400">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg transition-colors mt-2">
            Sign In
        </button>
    </form>
</div>
{% endblock %}
