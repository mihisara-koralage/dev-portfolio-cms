{% extends 'dashboard/base.html' %}

{% block title %}Confirm Delete{% endblock %}
{% block page_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-gray-900 rounded-xl border border-red-900 p-8 text-center">
        <div class="w-16 h-16 bg-red-900 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold text-white mb-2">Are you sure?</h2>
        <p class="text-gray-400 mb-6">
            You are about to delete <strong class="text-white">{{ object }}</strong>.
            This action cannot be undone.
        </p>
        <form method="post" class="flex gap-4 justify-center">
            {% csrf_token %}
            <a href="javascript:history.back()"
               class="px-6 py-2.5 rounded-lg border border-gray-700 text-gray-300 hover:bg-gray-800 transition-colors">
                Cancel
            </a>
            <button type="submit"
                class="px-6 py-2.5 rounded-lg bg-red-600 hover:bg-red-500 text-white font-semibold transition-colors">
                Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
