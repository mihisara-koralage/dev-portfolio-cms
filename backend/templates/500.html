<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center">
    <div class="text-center px-6 max-w-lg">

        <div class="relative mb-8">
            <p class="text-9xl font-extrabold text-slate-800 select-none">500</p>
            <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-20 h-20 bg-red-600/20 rounded-2xl flex items-center justify-center border border-red-600/30">
                    <i class="fa-solid fa-triangle-exclamation text-red-400 text-3xl"></i>
                </div>
            </div>
        </div>

        <h1 class="text-2xl font-bold text-white mb-3">Something Went Wrong</h1>
        <p class="text-slate-400 mb-8 leading-relaxed">
            An unexpected error occurred on our end.
            The issue has been logged and will be looked into.
        </p>

        <div class="flex flex-wrap gap-3 justify-center">
            <a href="/"
               class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition-colors">
                <i class="fa-solid fa-house mr-2"></i>Go Home
            </a>
            <button onclick="window.location.reload()"
                    class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 hover:text-white font-semibold rounded-xl transition-colors">
                <i class="fa-solid fa-rotate-right mr-2"></i>Try Again
            </button>
        </div>
    </div>
</body>
</html>
